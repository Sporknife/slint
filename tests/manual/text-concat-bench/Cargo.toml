[package]
name = "text-concat-bench"
description.workspace = true
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "text-concat-bench"
path = "bench.rs"

[dependencies]
slint = { workspace = true, features = ["std", "compat-1-2", "libm", "unsafe-single-threaded", "renderer-software"] }

[build-dependencies]
slint-build = { path = "../../../api/rs/build", features = ["renderer-software"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(slint_debug_property)"] }
